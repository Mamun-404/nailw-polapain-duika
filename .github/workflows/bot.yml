name: ux50-signal-bot

on:
  schedule:
    # every 15 minutes, UTC; adjust based on your free minutes budget
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux50-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Single scan pass
        env:
          EXNESS_SYMBOLS: ${{ vars.EXNESS_SYMBOLS }}
          EXNESS_TIMEFRAME_MINUTES: ${{ vars.EXNESS_TIMEFRAME_MINUTES }}
          EXNESS_STATUS_EVERY_SECONDS: "3600"
          EXNESS_TELEGRAM_PASS_EVERY: "4"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ux50_freefeed/run_once.py

      - name: Commit state back for next run
        run: |
          git config user.name "ux50-bot"
          git config user.email "ux50-bot@users.noreply.github.com"
          git add ux50_freefeed/*.json
          git commit -m "state update $(date -u +%F-%T)" || echo "no state changes"
          git push